<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Sahayak</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #fff9f2;
        color: #26221e;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .tile {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #f43f5e, #b91c1c);
        display: inline-grid;
        place-items: center;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #57534e;
        max-width: 34rem;
        line-height: 1.6;
        margin: 0 auto 20px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 20px;
        font-weight: 600;
        background: #e11d48;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="tile" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff">
          <path d="M12 3 2 8.5 12 14l10-5.5L12 3Zm-7 8.9v4.1c0 1.7 3.1 3.5 7 3.5s7-1.8 7-3.5v-4.1l-7 3.8-7-3.8Z" />
        </svg>
      </span>
      <h1>You are offline</h1>
      <p>
        Sahayak could not reach the network. Pages you visited recently may still work — try going back or
        reloading. Your saved answers and the answer store will be here when you reconnect.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
